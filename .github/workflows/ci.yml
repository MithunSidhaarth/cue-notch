name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The app's tests and its bundle both need the relay built first.
      - run: cargo build --release -p cue-hook
      - run: cargo test --workspace
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-Windows-setup
          path: release/Cue-Windows-*-setup.exe
      # On a version tag: prove where the installer came from, then publish it.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Cue-Windows-*-setup.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Cue-Windows-*-setup.exe
          generate_release_notes: true
